# Travel With Chaudharys — complete Nginx site (HTTPS, HTTP/2, compression,
# caching, security headers). Replaces /etc/nginx/sites-available/twc.
#
#   1. HTTPS certificate first:
#        apt install -y certbot python3-certbot-nginx
#        certbot certonly --nginx -d travelwithchaudhary.cloud -d www.travelwithchaudhary.cloud
#   2. Brotli module (if available — otherwise delete the brotli_* lines):
#        apt install -y libnginx-mod-http-brotli-static libnginx-mod-http-brotli-filter
#   3. cp ~/twc/deploy/nginx-headers.conf /etc/nginx/snippets/twc-headers.conf
#      cp ~/twc/deploy/nginx-site.conf   /etc/nginx/sites-available/twc
#   4. nginx -t && systemctl reload nginx
#
# "http2 on;" needs nginx 1.25.1+. On older nginx delete that line and write
# "listen 443 ssl http2;" instead (check with: nginx -v).

server {
    listen 80;
    listen [::]:80;
    server_name travelwithchaudhary.cloud www.travelwithchaudhary.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name travelwithchaudhary.cloud www.travelwithchaudhary.cloud;

    ssl_certificate     /etc/letsencrypt/live/travelwithchaudhary.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travelwithchaudhary.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    root /var/www/twc;
    client_max_body_size 64k;

    # The build ships .br and .gz next to every text file — send those rather
    # than compressing on every request.
    brotli_static on;
    brotli on;
    brotli_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Content-hashed build files never change under the same name: a year.
    location /assets/ {
        include /etc/nginx/snippets/twc-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Photos, video, icons: a week.
    location ~* \.(?:webp|avif|png|jpe?g|ico|mp4|webm|woff2)$ {
        include /etc/nginx/snippets/twc-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # The pre-rendered home page — always re-checked so a deploy shows at once.
    location = / {
        include /etc/nginx/snippets/twc-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # API — Node compresses its own replies; reuse connections to it.
    location /api/ {
        include /etc/nginx/snippets/twc-headers.conf;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never serve dotfiles (.env, .git).
    location ~ /\. {
        deny all;
    }

    # Every other address (/admin, /about, /search…) gets the plain app shell,
    # not the pre-rendered home page.
    location / {
        include /etc/nginx/snippets/twc-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /app.html;
    }
}
