# Security headers — included in every location of deploy/nginx-site.conf.
# Install:  cp ~/twc/deploy/nginx-headers.conf /etc/nginx/snippets/twc-headers.conf
#
# (Nginx drops server-level add_header lines inside any location that sets its
# own, so each location includes this file instead.)

# No includeSubDomains: other subdomains (e.g. mail) may not all have HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Only the sources the site uses: its own files (fonts are self-hosted), Google
# Sign-In for the admin page, Unsplash stock photos. If something breaks, the
# browser console (F12) names the blocked source — add it to that directive.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self'; img-src 'self' data: https://images.unsplash.com https://*.googleusercontent.com; media-src 'self'; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
