version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: twc_mongodb
    # No published port: only the backend container (on twc-network) needs the
    # database. Publishing 27017 exposed it to anything that can reach the host.
    volumes:
      - mongo_data:/data/db
    networks:
      - twc-network

  backend:
    build: ./backend
    container_name: twc_backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/travelwithchaudharys
      - PORT=5000
    depends_on:
      - mongodb
    networks:
      - twc-network

  # Production build served by Nginx (multi-stage Dockerfile) — open
  # http://localhost:8080. For development use `npm run dev` instead.
  frontend:
    build: ./frontend
    container_name: twc_frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend
    networks:
      - twc-network

volumes:
  mongo_data:

networks:
  twc-network:
    driver: bridge
